version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: board-game-cafe-db
    environment:
      POSTGRES_DB: board_game_cafe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - boardgame_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d board_game_cafe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  boardgame_network:
    driver: bridge