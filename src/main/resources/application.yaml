spring:
  application:
    name: board-game-cafe

  datasource:
    url: jdbc:postgresql://localhost:5432/board_game_cafe
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true

  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  port: 8080
  servlet:
    context-path: /api